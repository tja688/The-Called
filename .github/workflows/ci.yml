name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Test kernel
        run: dotnet test Pcd.slnx --configuration Release --nologo

      - name: Compare .NET and WebAssembly
        run: node tools/compare-runtimes.mjs

      - name: Test web
        run: npm ci && npm test && npm run lint
