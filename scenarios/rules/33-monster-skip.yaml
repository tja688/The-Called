name: 意图没有合法落点时跳过并推进到下一条
cards:
  - id: card.tp
    points: 2
    name: 玩家
  - id: card.t1
    points: 1
    name: 一
  - id: card.t2
    points: 2
    name: 二
  - id: card.t3
    points: 3
    name: 三
  - id: card.t4
    points: 4
    name: 四
  - id: card.th
    points: 1
    name: 手里
  - id: card.next
    points: 3
    name: 下一条
monster:
  id: monster.t01
  intents:
    - card.t1
    - card.next
position:
  phase: monster-action
  round: 1
  intentIndex: 0
  player:
    hand:
      - card: card.th
    deck: []
  board:
    - { cell: 1, card: card.tp, owner: player }
    - { cell: 2, card: card.tp, owner: player }
    - { cell: 3, card: card.tp, owner: player }
    - { cell: 4, card: card.tp, owner: player }
    - { cell: 5, card: card.tp, owner: player }
    - { cell: 6, card: card.t1, owner: monster }
    - { cell: 7, card: card.t2, owner: monster }
    - { cell: 8, card: card.t3, owner: monster }
    - { cell: 9, card: card.t4, owner: monster }
opening:
  events:
    - type: action-skipped
      card: card.t1
      reason: no-legal-cell
      index: 0
    - type: turn-ended
      owner: monster
    - type: turn-started
      owner: player
      round: 2
    - type: intent-revealed
      card: card.next
      index: 1
      cell: 0
    - type: draw-skipped
      reason: deck-empty
  totals:
    player: 10
    monster: 10
  pending:
    actor: player
  result: ongoing
