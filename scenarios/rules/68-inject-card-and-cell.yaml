name: 可以向卡牌和格位注入能力
cards:
  - id: card.ta
    points: 3
    name: 载体
  - id: card.ti
    points: 1
    name: 意图
abilities:
  - id: ability.card
    trigger: turn-start
    actions:
      - kind: gain-resource
        resource: resource.faith
        amount: 1
  - id: ability.cell
    trigger: turn-start
    actions:
      - kind: gain-resource
        resource: resource.faith
        amount: 1
resources:
  - id: resource.faith
    name: 信仰
monster:
  id: monster.t01
  intents:
    - card.ti
position:
  phase: player-turn-start
  round: 0
  injections:
    - host: card:card.ta
      ability: ability.card
    - host: cell:3
      ability: ability.cell
  player:
    hand:
      - card: card.ti
  board:
    - cell: 1
      card: card.ta
      owner: player
opening:
  playerFaith: 2
  result: ongoing
