name: 意图按顺序循环且落点留到怪物回合
cards:
  - id: card.th
    points: 1
    name: 手里
  - id: card.ia
    points: 1
    name: 甲意图
  - id: card.ib
    points: 1
    name: 乙意图
monster:
  id: monster.t01
  intents:
    - card.ia
    - card.ib
position:
  phase: player-action
  round: 1
  intentIndex: 0
  player:
    hand:
      - card: card.th
    deck: []
steps:
  - answer: end-turn
    events:
      - type: turn-ended
        owner: player
      - type: turn-started
        owner: monster
        round: 1
    pending:
      actor: monster
  - answer: cell:1
    events:
      - type: card-played
        card: card.ia
        cell: 1
      - type: card-entered
        card: card.ia
        cell: 1
        owner: monster
      - type: turn-ended
        owner: monster
      - type: turn-started
        owner: player
        round: 2
      - type: intent-revealed
        card: card.ib
        index: 1
        cell: 0
      - type: draw-skipped
        reason: deck-empty
    pending:
      actor: player
  - answer: end-turn
    events:
      - type: turn-ended
        owner: player
      - type: turn-started
        owner: monster
    pending:
      actor: monster
  - answer: cell:2
    events:
      - type: card-played
        card: card.ib
        cell: 2
      - type: card-entered
        card: card.ib
        cell: 2
        owner: monster
      - type: turn-ended
        owner: monster
      - type: turn-started
        owner: player
        round: 3
      - type: intent-revealed
        card: card.ia
        index: 0
        cell: 0
      - type: draw-skipped
        reason: deck-empty
    pending:
      actor: player
    result: ongoing
