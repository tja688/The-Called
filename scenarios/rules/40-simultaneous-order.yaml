name: 同时触发按全局、格序、其他区域
cards:
  - id: card.ta
    points: 3
    name: 格一
    abilities:
      - trigger: turn-start
        zone: board
        actions:
          - kind: gain-resource
            resource: resource.faith
            amount: 1
  - id: card.tb
    points: 3
    name: 格九
    abilities:
      - trigger: turn-start
        zone: board
        actions:
          - kind: gain-resource
            resource: resource.faith
            amount: 1
  - id: card.th
    points: 3
    name: 手牌
    abilities:
      - trigger: turn-start
        actions:
          - kind: gain-resource
            resource: resource.faith
            amount: 1
  - id: card.ti
    points: 1
    name: 意图
abilities:
  - id: ability.global
    trigger: turn-start
    side: player
    actions:
      - kind: gain-resource
        resource: resource.faith
        amount: 1
resources:
  - id: resource.faith
    name: 信仰
monster:
  id: monster.t01
  skills:
    - ability.global
  intents:
    - card.ti
position:
  phase: player-turn-start
  round: 0
  player:
    hand:
      - card: card.th
  board:
    - cell: 9
      card: card.tb
      owner: player
    - cell: 1
      card: card.ta
      owner: player
opening:
  events:
    - type: turn-started
      owner: player
    - type: resource-changed
      before: 0
      after: 1
    - type: resource-changed
      before: 1
      after: 2
    - type: resource-changed
      before: 2
      after: 3
    - type: resource-changed
      before: 3
      after: 4
    - type: intent-revealed
    - type: draw-skipped
  playerFaith: 4
  result: ongoing
