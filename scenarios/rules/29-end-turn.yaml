name: 玩家可以主动结束回合
cards:
  - id: card.tp
    points: 2
    name: 玩家
  - id: card.tm
    points: 4
    name: 怪物
monster:
  id: monster.t01
  intents:
    - card.tm
position:
  phase: player-action
  round: 1
  opportunities: 1
  player:
    hand:
      - card: card.tp
  board:
    - { cell: 5, card: card.tm, owner: monster }
steps:
  - answer: end-turn
    events:
      - type: turn-ended
        owner: player
      - type: turn-started
        owner: monster
    handCount: 1
    pending:
      actor: monster
    result: ongoing
