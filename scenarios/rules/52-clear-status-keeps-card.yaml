name: 清除状态留下卡牌，移除才进入弃牌堆
cards:
  - id: card.ta
    points: 3
    name: 清除
    abilities:
      - target:
          pick: one
          side: opponent
        actions:
          - kind: clear-status
            status: status.mark
  - id: card.tb
    points: 4
    name: 带标记
  - id: card.tc
    points: 4
    name: 被移除
  - id: card.td
    points: 3
    name: 移除
    abilities:
      - target:
          pick: one
          side: opponent
        actions:
          - kind: remove
  - id: card.ti
    points: 1
    name: 意图
statuses:
  - id: status.mark
    name: 解析标记
monster:
  id: monster.t01
  intents:
    - card.ti
position:
  phase: player-action
  round: 1
  opportunities: 2
  player:
    hand:
      - card: card.ta
      - card: card.td
  board:
    - cell: 1
      card: card.tb
      owner: monster
      statuses: [status.mark]
    - cell: 2
      card: card.tc
      owner: monster
steps:
  - answer: play:3:4
    pending:
      type: choose-card
  - answer: card:1
    board:
      - cell: 1
        card: card.tb
        owner: monster
        statuses: []
        points: 4
  - answer: play:4:5
    pending:
      type: choose-card
  - answer: card:2
    playerDiscard: []
    monsterDiscard:
      - card: card.tc
    board:
      - cell: 1
        card: card.tb
    result: ongoing
