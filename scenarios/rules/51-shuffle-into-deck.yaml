name: 放入牌组就是洗入随机位置
cards:
  - id: card.ta
    points: 3
    name: 洗入
    abilities:
      - actions:
          - kind: copy
            of: self
            to: deck
  - id: card.td
    points: 1
    name: 原牌
  - id: card.ti
    points: 1
    name: 意图
monster:
  id: monster.t01
  intents:
    - card.ti
position:
  phase: player-action
  round: 1
  seed: 1
  player:
    deck:
      - card: card.td
    hand:
      - card: card.ta
steps:
  - answer: play:2:3
    deckCount: 2
    deck:
      - card: card.td
      - card: card.ta
    result: ongoing
