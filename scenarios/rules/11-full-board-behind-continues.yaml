name: 满格但自己的总点数不更高则继续且不看占格
cards:
  - id: card.ta01
    points: 1
    name: 玩家
  - id: card.ta02
    points: 2
    name: 怪物
  - id: card.ta03
    points: 1
    name: 手里
monster:
  id: monster.t01
  intents:
    - card.ta02
position:
  phase: player-turn-start
  round: 0
  player:
    hand:
      - card: card.ta03
    deck: []
  board:
    - { cell: 1, card: card.ta01, owner: player }
    - { cell: 2, card: card.ta01, owner: player }
    - { cell: 3, card: card.ta01, owner: player }
    - { cell: 4, card: card.ta01, owner: player }
    - { cell: 5, card: card.ta01, owner: player }
    - { cell: 6, card: card.ta02, owner: monster }
    - { cell: 7, card: card.ta02, owner: monster }
    - { cell: 8, card: card.ta02, owner: monster }
    - { cell: 9, card: card.ta02, owner: monster }
opening:
  events:
    - type: turn-started
      owner: player
      round: 1
    - type: intent-revealed
      card: card.ta02
      cell: 0
    - type: draw-skipped
      reason: deck-empty
  pending:
    actor: player
  result: ongoing
