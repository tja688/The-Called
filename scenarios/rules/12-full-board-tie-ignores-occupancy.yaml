name: 满格且总点数相同时不比较占格
cards:
  - id: card.tp
    points: 2
    name: 玩家
  - id: card.t1
    points: 1
    name: 一
  - id: card.t2
    points: 2
    name: 二
  - id: card.t3
    points: 3
    name: 三
  - id: card.t4
    points: 4
    name: 四
  - id: card.th
    points: 1
    name: 手里
monster:
  id: monster.t01
  intents:
    - card.t1
position:
  phase: player-turn-start
  round: 0
  player:
    hand:
      - card: card.th
    deck: []
  board:
    - { cell: 1, card: card.tp, owner: player }
    - { cell: 2, card: card.tp, owner: player }
    - { cell: 3, card: card.tp, owner: player }
    - { cell: 4, card: card.tp, owner: player }
    - { cell: 5, card: card.tp, owner: player }
    - { cell: 6, card: card.t1, owner: monster }
    - { cell: 7, card: card.t2, owner: monster }
    - { cell: 8, card: card.t3, owner: monster }
    - { cell: 9, card: card.t4, owner: monster }
opening:
  events:
    - type: turn-started
      owner: player
      round: 1
    - type: intent-revealed
      index: 0
    - type: draw-skipped
      reason: deck-empty
  totals:
    player: 10
    monster: 10
  pending:
    actor: player
  result: ongoing
