name: 特殊结算先比总点数
cards:
  - id: card.tp
    points: 5
    name: 玩家
  - id: card.tm
    points: 3
    name: 怪物
monster:
  id: monster.t01
  intents:
    - card.tm
position:
  phase: player-action
  round: 1
  player:
    hand:
      - card: card.tp
  board:
    - { cell: 1, card: card.tp, owner: player }
    - { cell: 2, card: card.tm, owner: monster }
steps:
  - special: true
    events:
      - type: match-ended
        winner: player
        reason: special
        cause:
          - special-settlement
    result:
      winner: player
      reason: special
