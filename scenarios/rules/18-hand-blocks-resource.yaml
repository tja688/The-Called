name: 手里还有牌就不做资源结算
cards:
  - id: card.tp
    points: 1
    name: 玩家
  - id: card.tm
    points: 5
    name: 怪物
  - id: card.th
    points: 1
    name: 手里
monster:
  id: monster.t01
  intents:
    - card.tm
position:
  phase: player-turn-start
  round: 0
  player:
    hand:
      - card: card.th
    deck: []
  board:
    - { cell: 1, card: card.tp, owner: player }
    - { cell: 2, card: card.tm, owner: monster }
opening:
  events:
    - type: turn-started
      owner: player
    - type: intent-revealed
    - type: draw-skipped
      reason: deck-empty
  pending:
    actor: player
  result: ongoing
