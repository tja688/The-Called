name: 满格与资源结算同时成立时按资源结算
cards:
  - id: card.tp
    points: 1
    name: 玩家
  - id: card.tm
    points: 2
    name: 怪物
monster:
  id: monster.t01
  intents:
    - card.tm
position:
  phase: player-turn-start
  round: 0
  player:
    hand: []
    deck: []
  board:
    - { cell: 1, card: card.tp, owner: player }
    - { cell: 2, card: card.tp, owner: player }
    - { cell: 3, card: card.tp, owner: player }
    - { cell: 4, card: card.tp, owner: player }
    - { cell: 5, card: card.tp, owner: player }
    - { cell: 6, card: card.tm, owner: monster }
    - { cell: 7, card: card.tm, owner: monster }
    - { cell: 8, card: card.tm, owner: monster }
    - { cell: 9, card: card.tm, owner: monster }
opening:
  events:
    - type: turn-started
      owner: player
      round: 1
    - type: match-ended
      winner: monster
      reason: resource
  result:
    winner: monster
    reason: resource
