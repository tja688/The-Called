    pending:
      type: choose-card
  - answer: card:2
    board:
      - cell: 1
        card: card.c021
        owner: player
        points: 7
        statuses: [status.mark]
      - cell: 5
        card: card.m002
        points: 5
      - cell: 6
        card: card.c018
        timer: 2
    result: ongoing
