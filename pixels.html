<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>The Called · 像素资产编辑页（dev）</title>
    <style>
      body { margin: 0; background: #1a1420; color: #f5e6c8; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 240px 1fr 300px; height: 100vh; }
      #list { overflow: auto; border-right: 1px solid #3d2b33; padding: 8px; }
      #list button { display: block; width: 100%; text-align: left; background: none; border: none; color: #f5e6c8; padding: 3px 6px; cursor: pointer; font: inherit; }
      #list button:hover, #list button.on { background: #3d2b33; }
      #list h4 { margin: 10px 0 4px; color: #ffd27a; font-size: 12px; }
      #main { overflow: auto; padding: 12px; }
      #side { border-left: 1px solid #3d2b33; padding: 10px; overflow: auto; }
      canvas.px { image-rendering: pixelated; background: #2a1e24; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
      .cell { text-align: center; font-size: 11px; color: #c2bcc8; }
      .pal { display: flex; flex-wrap: wrap; gap: 4px; }
      .pal span { width: 22px; height: 22px; border: 2px solid transparent; cursor: pointer; display: inline-block; }
      .pal span.on { border-color: #fff8ee; }
      textarea { width: 100%; height: 220px; background: #0f1330; color: #f5e6c8; border: 1px solid #3d2b33; font: 11px/1.3 Consolas, monospace; }
      .tools button { background: #6b3f26; color: #f5e6c8; border: 1px solid #d9985a; padding: 4px 8px; margin: 2px; cursor: pointer; }
      .tools button.on { background: #ff9a3d; color: #2a1e24; }
      .lint { font-size: 11px; white-space: pre-wrap; color: #f0a06a; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="list"></div>
      <div id="main"></div>
      <div id="side"></div>
    </div>
    <script type="module" src="/src/pixel/editor/main.ts"></script>
  </body>
</html>
